spring:
  application:
    name: harmony-api
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  servlet:
    context-path: /api

brevo:
  api-key: ${BREVO_API_KEY}
  sender-email: morettithomas54@gmail.com
  sender-name: Harmony

logging:
  level:
    com:
      motompro:
        harmony=DEBUG:
